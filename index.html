<!DOCTYPE html>
<html lang="en">
<head>
	<title>Happy Graduation 🎀 Wijdan</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://fonts.googleapis.com/css2?family=Signika:wght@400;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="stylesheet.css">
</head>
<body>

	<!-- ===== START SCREEN ===== -->
	<div id="start-screen">
		<canvas id="sakura-start-canvas"></canvas>
		<button id="start-btn">✨ Start ✨</button>
	</div>

	<!-- ===== MAIN PAGE ===== -->
	<div id="main-page" style="display:none;">

		<audio id="bg-music" loop><source src="hbd.mp3"></audio>

		<canvas id="sakura-canvas"></canvas>
		<canvas id="balloon-canvas"></canvas>
		<canvas id="fireworks-canvas"></canvas>

		<!-- HERO: cap + name + subtitle -->
		<div id="hero">
			<div id="grad-cap-wrap">
				<div class="cap-board"></div>
				<div class="cap-top"></div>
				<div class="cap-tassel"></div>
			</div>
			<h1 id="graduate-name">🎀 wijdan</h1>
			<p id="graduate-subtitle">Celebrating your graduation journey</p>
			<span class="deco-star" id="s1">✦</span>
			<span class="deco-star" id="s2">✧</span>
			<span class="deco-star" id="s3">✦</span>
			<span class="deco-star" id="s4">✧</span>
		</div>

		<!-- MESSAGE SCREEN -->
		<div id="msg-screen">
			<div id="msg-header">
				<div id="msg-cap">
					<div class="cap-board"></div>
					<div class="cap-top"></div>
					<div class="cap-tassel"></div>
				</div>
				<h2 id="msg-name">🎀 wijdan</h2>
				<p id="msg-label">Graduate 🎓</p>
			</div>
			<div id="msg-stage">
				<p id="msg-line1" class="msg-line"></p>
				<p id="msg-line2" class="msg-line"></p>
			</div>
		</div>

		<!-- ACTION BAR -->
		<div id="action-bar">
			<button class="btn-bloom" id="btn-story">💌 A Message for You</button>
		</div>

	</div>

</body>
<script src="effect.js"></script>
</html>
